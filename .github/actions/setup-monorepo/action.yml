name: Setup Monorepo

description: |
  统一安装 pnpm、Node、全局工具与项目依赖。
  供 release.yml、ci.yaml 等需要执行 build 的工作流复用。

inputs:
  node-version:
    description: Node.js 版本
    required: false
    default: "24.18.0"
  registry-url:
    description: npm registry URL
    required: false
    default: "https://registry.npmjs.org"
  with-vercel:
    description: 是否全局安装 vercel CLI
    required: false
    default: "true"
  with-npm:
    description: 是否全局安装 npm（release 流程需要）
    required: false
    default: "false"
  install-flags:
    description: 传给 pnpm install 的附加参数（如 --frozen-lockfile --ignore-scripts）
    required: false
    default: ""

runs:
  using: composite
  steps:
    # 标准顺序：先安装 pnpm，再让 setup-node 识别 pnpm 缓存
    - name: 安装pnpm
      uses: pnpm/action-setup@v5
      with:
        run_install: false

    - name: 安装node
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}

    # pnpm 12 起 corepack 无法安装/运行 pnpm（原生二进制分发），
    # corepack enable/install 步骤已移除
    # 全局安装 CI 所需的工具（与项目依赖隔离，避免污染 install 参数）
    # pnpm 12 要求全局 bin 目录在 PATH 中（ERR_PNPM_GLOBAL_BIN_DIR_NOT_IN_PATH），
    # 故显式声明 PNPM_HOME 并回写 GITHUB_PATH 供后续步骤使用
    - name: 全局安装CI工具
      shell: bash
      run: |
        export PNPM_HOME="$HOME/.local/share/pnpm"
        export PATH="$PNPM_HOME:$PNPM_HOME/bin:$PATH"
        echo "$PNPM_HOME/bin" >> "$GITHUB_PATH"
        echo "$PNPM_HOME" >> "$GITHUB_PATH"
        GLOBAL_TOOLS="@dotenvx/dotenvx tsx turbo"
        if [ "${{ inputs.with-vercel }}" = "true" ]; then
          GLOBAL_TOOLS="$GLOBAL_TOOLS vercel"
        fi
        if [ "${{ inputs.with-npm }}" = "true" ]; then
          GLOBAL_TOOLS="$GLOBAL_TOOLS npm"
        fi
        pnpm add -g $GLOBAL_TOOLS

    - name: 安装整个项目的依赖
      shell: bash
      run: pnpm i ${{ inputs.install-flags }}
