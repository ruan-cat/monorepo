name: temporary Skill Router Stage 2 apply

on:
  push:
    branches:
      - skill-router-mcp-stage2-impl-batch1
    paths:
      - .github/workflows/skill-router-stage2-temp-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Materialize verified Stage 2 blobs
        shell: bash
        run: |
          node <<'NODE'
          import fs from "node:fs/promises";
          import path from "node:path";

          const files = new Map([
            ["packages/skill-router-mcp/repositories/github-skill-source.ts", "a8cecd8a5dec4240b14d8d2dc07dff65cb26346b"],
            ["packages/skill-router-mcp/services/resource-resolver.ts", "ff2e86ee96e75352459d7e6ed2edad12edfdc6c3"],
            ["packages/skill-router-mcp/services/skill-router.ts", "87528427329b6c10ba4437a181a48bb334770fdc"],
            ["packages/skill-router-mcp/mcp/tools/list-skill-resources.ts", "f22c8dda68fbf7d9153a521512c0ed035a39325d"],
            ["packages/skill-router-mcp/mcp/tools/load-skill-resource.ts", "3b8ea8af05a362a213c06c7d87893780114bd17c"],
            ["packages/skill-router-mcp/mcp/tool-definitions.ts", "81d97eb547f3324f4fcb7c4e70ef59030f3a8c33"],
            ["packages/skill-router-mcp/README.md", "24d7abc06bd890abcbef9be559620dbb83fe805f"],
            ["packages/skill-router-mcp/tests/resource-resolver.test.ts", "49479b0d71de14ed4c0676837a3973fa699da0bb"],
            ["packages/skill-router-mcp/tests/production-harness.test.ts", "b15eb107ae2a39bd360dda4e1c3fe53323288ef8"],
          ]);

          for (const [target, sha] of files) {
            const response = await fetch(`https://api.github.com/repos/ruan-cat/monorepo/git/blobs/${sha}`, {
              headers: { Accept: "application/vnd.github+json", "User-Agent": "skill-router-stage2-batch" },
            });
            if (!response.ok) throw new Error(`blob ${sha} fetch failed: ${response.status}`);
            const payload = await response.json();
            const content = Buffer.from(String(payload.content).replace(/\s/g, ""), "base64");
            await fs.mkdir(path.dirname(target), { recursive: true });
            await fs.writeFile(target, content);
          }
          NODE
      - name: Remove temporary workflow and commit materialized files
        shell: bash
        run: |
          git rm .github/workflows/skill-router-stage2-temp-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/skill-router-mcp
          git commit -m "✨ feat(skill-router-mcp): materialize Stage 2 resource implementation"
          git push origin HEAD:skill-router-mcp-stage2-impl-batch1
