name: skill-router-mcp checks

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        default: "22"
      package-dir:
        type: string
        required: false
        default: "packages/skill-router-mcp"

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # 环境初始化统一收敛到复合 action，禁止在本文件内自行安装 pnpm / Node。
      # 该验证任务不需要 vercel CLI，且以 frozen lockfile + 跳过脚本的方式安装依赖。
      - name: 初始化 monorepo 环境
        uses: ./.github/actions/setup-monorepo
        with:
          node-version: ${{ inputs.node-version }}
          with-vercel: "false"
          install-flags: "--frozen-lockfile --ignore-scripts"
      - run: pnpm --dir ${{ inputs.package-dir }} run typecheck
      - run: pnpm --dir ${{ inputs.package-dir }} run test:all
      - run: pnpm --dir ${{ inputs.package-dir }} run build
