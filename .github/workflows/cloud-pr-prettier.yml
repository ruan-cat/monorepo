name: Cloud PR Prettier

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write

concurrency:
  group: cloud-pr-prettier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format-pr:
    name: 格式化 PR 改动
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: 检出 PR head 分支
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: 初始化 monorepo 环境
        uses: ./.github/actions/setup-monorepo
        with:
          with-vercel: "false"

      - name: 提取并精准格式化 PR 文件
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync, spawnSync } from "node:child_process";
          import { writeFileSync } from "node:fs";
          import { extname, join } from "node:path";

          const supportedExtensions = new Set([
            ".js",
            ".jsx",
            ".ts",
            ".tsx",
            ".mts",
            ".json",
            ".css",
            ".scss",
            ".md",
            ".yml",
            ".yaml",
            ".html",
          ]);

          const output = execFileSync(
            "git",
            [
              "diff",
              "--name-only",
              "-z",
              "--diff-filter=ACMR",
              `${process.env.BASE_SHA}...HEAD`,
            ],
            { encoding: "utf8" },
          );

          const prFiles = output.split("\0").filter(Boolean);
          const prettierFiles = prFiles.filter((file) => {
            const normalized = file.replaceAll("\\", "/");
            const segments = normalized.split("/");
            return supportedExtensions.has(extname(normalized)) && !segments.includes("snippets");
          });

          const fileListPath = join(process.env.RUNNER_TEMP, "cloud-pr-prettier-files.zlist");
          writeFileSync(
            fileListPath,
            prettierFiles.map((file) => `${file}\0`).join(""),
            "utf8",
          );

          console.log(`PR ACMR 文件数：${prFiles.length}`);
          console.log(`Prettier 精准候选文件数：${prettierFiles.length}`);
          for (const file of prettierFiles) {
            console.log(`- ${file}`);
          }

          if (prettierFiles.length === 0) {
            process.exit(0);
          }

          const commonArgs = [
            "exec",
            "prettier",
            "--experimental-cli",
            "--write",
            "--no-parallel",
            "--ignore-path",
            "./.config/.prettierignore",
            "--ignore-path",
            ".gitignore",
          ];

          const maxChunkChars = 100_000;
          let chunk = [];
          let chunkChars = 0;

          const runChunk = () => {
            if (chunk.length === 0) return;
            const result = spawnSync("pnpm", [...commonArgs, ...chunk], {
              stdio: "inherit",
            });
            if (result.error) throw result.error;
            if (result.status !== 0) process.exit(result.status ?? 1);
            chunk = [];
            chunkChars = 0;
          };

          for (const file of prettierFiles) {
            const argument = `./${file}`;
            const argumentChars = Buffer.byteLength(argument) + 1;
            if (chunk.length > 0 && chunkChars + argumentChars > maxChunkChars) {
              runChunk();
            }
            chunk.push(argument);
            chunkChars += argumentChars;
          }
          runChunk();
          NODE

      - name: 暂存并检查格式化结果
        id: diff
        shell: bash
        run: |
          FILE_LIST="$RUNNER_TEMP/cloud-pr-prettier-files.zlist"

          if [[ -s "$FILE_LIST" ]]; then
            git --literal-pathspecs add --all \
              --pathspec-from-file="$FILE_LIST" \
              --pathspec-file-nul
          fi

          git diff --cached --check
          git diff --cached --name-only
          git status --short

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建提交校验运行时
        if: steps.diff.outputs.changed == 'true'
        run: pnpm --filter "@ruan-cat/commitlint-config..." build

      - name: 提交格式化结果
        if: steps.diff.outputs.changed == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --check
          git commit -m "🌈 style: 自动格式化 PR #${PR_NUMBER} 改动"
          git status --short

      - name: 推送格式化提交到 PR head
        if: steps.diff.outputs.changed == 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: git push origin "HEAD:${HEAD_REF}"
