name: Temp Release PR154

on:
  push:
    branches:
      - 2026-8-27-good-git-commit-test-2

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: 2026-8-27-good-git-commit-test-2

      - name: Generate 10.7.0 release metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = '10.7.0';
          const jsonFiles = [
            '.claude-plugin/marketplace.json',
            '.cursor-plugin/marketplace.json',
            'ai-plugins/common-tools/.claude-plugin/plugin.json',
            'ai-plugins/common-tools/.cursor-plugin/plugin.json',
            'ai-plugins/common-tools/.codex-plugin/plugin.json',
            'ai-plugins/dev-skills/.claude-plugin/plugin.json',
            'ai-plugins/dev-skills/.cursor-plugin/plugin.json',
            'ai-plugins/dev-skills/.codex-plugin/plugin.json',
          ];
          for (const file of jsonFiles) {
            const json = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (file === '.claude-plugin/marketplace.json' || file === '.cursor-plugin/marketplace.json') {
              json.metadata.version = version;
              for (const plugin of json.plugins) plugin.version = version;
            } else {
              json.version = version;
            }
            fs.writeFileSync(file, JSON.stringify(json, null, '\t') + '\n');
          }
          function insertRelease(file, section) {
            let text = fs.readFileSync(file, 'utf8');
            if (text.includes('## [10.7.0] - 2026-08-27')) return;
            const marker = '## [Unreleased]\n';
            if (!text.includes(marker)) throw new Error(`${file}: missing Unreleased marker`);
            text = text.replace(marker, `${marker}\n${section}\n`);
            fs.writeFileSync(file, text);
          }
          insertRelease('ai-plugins/common-tools/CHANGELOG.md', `## [10.7.0] - 2026-08-27\n\n### Changed\n\n- **git-commit**：\`metadata.version\` \`0.6.0\` -> \`0.7.0\`。\n- 新增 \`Assisted-by: AGENT_NAME / MODEL_VERSION\` AI 协助归因，直接复用现有 Agent 与 Model 识别结果。\n- 保留原有 \`Co-authored-by\` allowlist、GitHub 账号/邮箱与 blacklist 处理行为，两套 trailer 独立并可同时存在。\n- 根级 Claude / Cursor marketplace 与 \`common-tools\` / \`dev-skills\` 的六份三平台 \`plugin.json\` 版本统一提升至 \`10.7.0\`。`);
          insertRelease('ai-plugins/dev-skills/CHANGELOG.md', `## [10.7.0] - 2026-08-27\n\n### Changed\n\n- \`dev-skills\` 技能树本身无内容变更，插件主版本随发布链路同步至 \`10.7.0\`。\n- 本次功能更新集中在 \`common-tools\` 的 **git-commit** Assisted-by AI 协助归因能力。\n- 根级 Claude / Cursor marketplace 与 \`common-tools\` / \`dev-skills\` 的六份三平台 \`plugin.json\` 版本统一提升至 \`10.7.0\`。`);
          NODE

      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          node -e "for (const f of ['.claude-plugin/marketplace.json','.cursor-plugin/marketplace.json','ai-plugins/common-tools/.claude-plugin/plugin.json','ai-plugins/common-tools/.cursor-plugin/plugin.json','ai-plugins/common-tools/.codex-plugin/plugin.json','ai-plugins/dev-skills/.claude-plugin/plugin.json','ai-plugins/dev-skills/.cursor-plugin/plugin.json','ai-plugins/dev-skills/.codex-plugin/plugin.json']) JSON.parse(require('node:fs').readFileSync(f,'utf8'))"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .claude-plugin/marketplace.json .cursor-plugin/marketplace.json ai-plugins/common-tools/.claude-plugin/plugin.json ai-plugins/common-tools/.cursor-plugin/plugin.json ai-plugins/common-tools/.codex-plugin/plugin.json ai-plugins/common-tools/CHANGELOG.md ai-plugins/dev-skills/.claude-plugin/plugin.json ai-plugins/dev-skills/.cursor-plugin/plugin.json ai-plugins/dev-skills/.codex-plugin/plugin.json ai-plugins/dev-skills/CHANGELOG.md
          git commit -m '📢 publish(root): 生成插件版本 10.7.0 发布文件'
          git push origin HEAD:2026-8-27-good-git-commit-test-2
