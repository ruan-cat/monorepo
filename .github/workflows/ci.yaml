name: CI

env:
  # https://turborepo.com/docs/crafting-your-repository/constructing-ci#enabling-remote-caching
  # https://vercel.com/docs/monorepos/remote-caching#use-remote-caching-from-external-ci/cd
  TURBO_TOKEN: ${{ secrets.vercel_token }}
  TURBO_TEAM: "ruancat-projects"

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
    paths:
      - "packages/skill-router-mcp/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci.yaml"
      - ".github/workflows/skill-router-mcp.yml"

jobs:
  tester:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: 检出分支
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 初始化 monorepo 环境
        uses: ./.github/actions/setup-monorepo
        with:
          with-vercel: "true"

      - name: 检查版本
        run: |
          node -v
          pnpm -v
          vc -v
          turbo --version

      - name: pnpm全局检查依赖包
        run: pnpm ls -g

      - name: turbo login 远程登录
        run: turbo login --token=${{env.TURBO_TOKEN}} --team=${{env.TURBO_TEAM}}

      - name: turbo link 链接远程项目
        run: turbo link --token=${{env.TURBO_TOKEN}} --scope=${{env.TURBO_TEAM}} --yes

      - name: turbo并发打包全部子项目
        run: pnpm run ci

      - name: 验证utils发布入口
        run: pnpm --filter @ruan-cat/utils test:entrypoints

  skill-router-mcp:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    uses: ./.github/workflows/skill-router-mcp.yml
    permissions:
      contents: read
    with:
      node-version: "22"
      pnpm-version: "10.33.0"
      package-dir: "packages/skill-router-mcp"
