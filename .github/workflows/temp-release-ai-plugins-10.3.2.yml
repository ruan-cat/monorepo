name: Temporary AI plugins 10.3.2 release metadata

on:
  push:
    branches:
      - 2026-08-18-release-use-other-model-10.3.2
    paths:
      - .github/workflows/temp-release-ai-plugins-10.3.2.yml

permissions:
  contents: write

jobs:
  release-metadata:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: 2026-08-18-release-use-other-model-10.3.2
          fetch-depth: 0

      - name: Run release-ai-plugins Apply
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File ai-plugins/common-tools/skills/release-ai-plugins/scripts/release-ai-plugins.ps1 `
            -Version 10.3.2 `
            -Date 2026-08-18 `
            -Apply

      - name: Correct release changelog semantics
        shell: powershell
        run: |
          $utf8 = New-Object System.Text.UTF8Encoding($false)

          $commonPath = "ai-plugins/common-tools/CHANGELOG.md"
          $common = [System.IO.File]::ReadAllText($commonPath)
          $commonNeedle = '- `common-tools` 技能树本身无内容变更，插件主版本随发布链路同步至 `10.3.2`。'
          $commonReplacement = @'
          - **use-other-model**：`metadata.version` `0.8.0` -> `0.9.0`。
          - 加固多模型委托的 preflight、provider/model 身份、原始证据与独立 verifier，避免仅凭退出码或执行者自报判定成功。
          - 新增 Weak Executor Contract，以 `DECISION_BUDGET: 0`、`EXACT_ACTIONS` 和 `STOP_IF` 收紧低能力执行模型边界。
          - 补齐独立分发自包含与 `design-memory.md`，确保全新项目无需源 monorepo 的 `.agents/` 或内部报告即可恢复当前执行与维护依据。
          '@.Trim()
          if (-not $common.Contains($commonNeedle)) {
            throw "common-tools CHANGELOG 未找到 release 脚本生成的 10.3.2 占位条目"
          }
          $common = $common.Replace($commonNeedle, $commonReplacement)
          [System.IO.File]::WriteAllText($commonPath, $common, $utf8)

          $devPath = "ai-plugins/dev-skills/CHANGELOG.md"
          $dev = [System.IO.File]::ReadAllText($devPath)
          $dev = [regex]::Replace(
            $dev,
            '(?ms)^## \[Unreleased\].*?(?=^## \[10\.3\.2\] - 2026-08-18)',
            "## [Unreleased]`n`n"
          )
          $devNeedle = '- `dev-skills` 技能树本身无内容变更，插件主版本随发布链路同步至 `10.3.2`。'
          $devReplacement = @'
          - `dev-skills` 技能树本身无内容变更，插件主版本随发布链路同步至 `10.3.2`。
          - 清理 `Unreleased` 中已在 `8.3.6` 发布的 `nitro-api-development` 重复记录，避免旧版本变更被二次归档。
          '@.Trim()
          if (-not $dev.Contains($devNeedle)) {
            throw "dev-skills CHANGELOG 未找到 release 脚本生成的 10.3.2 条目"
          }
          $dev = $dev.Replace($devNeedle, $devReplacement)
          [System.IO.File]::WriteAllText($devPath, $dev, $utf8)

      - name: Verify exact release write set
        shell: powershell
        run: |
          $allowed = @(
            ".claude-plugin/marketplace.json",
            ".cursor-plugin/marketplace.json",
            "ai-plugins/common-tools/.claude-plugin/plugin.json",
            "ai-plugins/common-tools/.cursor-plugin/plugin.json",
            "ai-plugins/common-tools/.codex-plugin/plugin.json",
            "ai-plugins/dev-skills/.claude-plugin/plugin.json",
            "ai-plugins/dev-skills/.cursor-plugin/plugin.json",
            "ai-plugins/dev-skills/.codex-plugin/plugin.json",
            "ai-plugins/common-tools/CHANGELOG.md",
            "ai-plugins/dev-skills/CHANGELOG.md"
          )
          $changed = @(git diff --name-only)
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) {
            throw "release Apply 产生了越界文件: $($unexpected -join ', ')"
          }
          if ($changed.Count -ne $allowed.Count) {
            throw "release 写集数量异常：expected=$($allowed.Count), actual=$($changed.Count); files=$($changed -join ', ')"
          }
          foreach ($path in $allowed) {
            if ($changed -notcontains $path) {
              throw "release 写集缺失: $path"
            }
          }
          node ai-plugins/common-tools/skills/release-ai-plugins/scripts/generate-skill-registry.mjs --check
          if ($LASTEXITCODE -ne 0) { throw "skill-registry canonical check failed" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed" }

      - name: Commit generated release metadata and remove temporary workflow
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-release-ai-plugins-10.3.2.yml
          git add -- ".claude-plugin/marketplace.json" ".cursor-plugin/marketplace.json" `
            "ai-plugins/common-tools/.claude-plugin/plugin.json" `
            "ai-plugins/common-tools/.cursor-plugin/plugin.json" `
            "ai-plugins/common-tools/.codex-plugin/plugin.json" `
            "ai-plugins/dev-skills/.claude-plugin/plugin.json" `
            "ai-plugins/dev-skills/.cursor-plugin/plugin.json" `
            "ai-plugins/dev-skills/.codex-plugin/plugin.json" `
            "ai-plugins/common-tools/CHANGELOG.md" `
            "ai-plugins/dev-skills/CHANGELOG.md"
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw "staged diff check failed" }
          git commit -m "📢 release(ai-plugins): 发布 10.3.2 插件元数据"
          git push origin HEAD:2026-08-18-release-use-other-model-10.3.2
