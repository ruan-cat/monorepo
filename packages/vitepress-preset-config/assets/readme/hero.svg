<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">少写重复配置</title>
  <desc id="desc">VitePress 仍是你的配置；此预设只收敛中文文档站的常用默认值。</desc>
  <rect width="1200" height="420" fill="#f6f1e8"/>
  <rect x="46" y="46" width="1108" height="328" fill="none" stroke="#1f2430" stroke-width="2"/>
  <path d="M76 83H1124M76 334H1124" stroke="#1f2430" stroke-width="1"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" fill="#1f2430">
    <text x="76" y="76" font-size="18" font-weight="700" letter-spacing="2">A PRESET, NOT A REPLACEMENT</text>
    <text x="76" y="159" font-size="72" font-weight="800">少写重复配置</text>
    <text x="80" y="203" font-size="24">VitePress 仍是你的配置；预设只收敛常用默认值。</text>
    <text x="80" y="287" fill="#595d66" font-size="18">主题　Markdown　导航　侧边栏　常用文档插件</text>
    <text x="80" y="320" fill="#595d66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">@ruan-cat/vitepress-preset-config</text>
  </g>
  <g transform="translate(748 99)">
    <path d="M48 0V202M22 0H48M22 202H48" fill="none" stroke="#bd34fe" stroke-width="7"/>
    <path d="M342 0V202M342 0H368M342 202H368" fill="none" stroke="#42b883" stroke-width="7"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">
      <text x="78" y="42" fill="#6b21a8">const config =</text>
      <text x="78" y="78" fill="#1f2430">  setUserConfig({</text>
      <text x="104" y="114" fill="#1f2430">title: "我的文档站",</text>
      <text x="104" y="150" fill="#1f2430">themeConfig: { ... },</text>
      <text x="78" y="186" fill="#1f2430">  });</text>
    </g>
  </g>
</svg>
